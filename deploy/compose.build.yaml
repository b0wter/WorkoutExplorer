# Self-builders (F-59 IP-18): builds the app image from this checkout instead of
# pulling the published one. Select with COMPOSE_FILE=compose.yaml:compose.build.yaml
# in .env, then `docker compose build && docker compose up -d`. Caddy and
# everything else stay as in compose.yaml. Version: `unknown` unless built with
# `docker compose build --build-arg VERSION=vX.Y.Z`.
services:
  app:
    image: workout-explorer:local
    platform: linux/amd64
    build: {context: .., dockerfile: deploy/Dockerfile}
