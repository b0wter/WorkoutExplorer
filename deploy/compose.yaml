# Workout Explorer on one VPS (F-31, ADR-034 rev. 5, F-59): Caddy on plain HTTP behind the
# operator's reverse proxy, and the Go server on an internal network. Lives at
# /srv/workout-explorer/compose.yaml next to .env (deploy/example.env), conf/Caddyfile and operator/.
# Use the copy from a release's deploy archive: it names our image by digest (F-59 IP-5). This
# repository copy names a tag that never exists, so it starts `app` only with compose.build.yaml.
# Nothing here creates a host path (DP-3).
name: workout-explorer

x-common: &common
  restart: unless-stopped # a crash, an OOM kill or a reboot restarts; `docker compose stop` stays stopped (DP-7)
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  stop_grace_period: 30s # above serve's 10 s shutdown grace (F-01)
  logging:
    driver: local # size-rotated, on the VPS only (DP-11)
    options: {max-size: 10m, max-file: "5"}

services:
  app:
    <<: *common
    # The release writes ghcr.io/<owner>/workout-explorer:vX.Y.Z@sha256:… here (ADR-052); no variable, so .env cannot redirect it.
    image: ghcr.io/b0wter/workout-explorer:unreleased
    user: "10001:10001"
    command: ["serve", "-addr", ":8080", "-data", "${WX_DATA:-/srv/workouts}", "-web", "/srv/workout-explorer/web"]
    env_file: .env
    environment:
      # Caddy's address on `backend`: the one proxy Go believes (DP-1a). Same value as Caddy's ipv4_address below.
      WORKOUT_EXPLORER_TRUSTED_PROXY: 10.250.1.2
    # DP-8: memory.peak of 4 uploads at the parse limits (F-09 QA: 620 to 861 MB) + one publish
    # + the rate table at its maximum (112 MB) + 20 %, rounded up to 100 MB. A `regenerate` run
    # beside it is not included (overlap accepted, F-30 RG-13). The runbook records the
    # peak measured on the VPS; change this value only together with that record.
    mem_limit: 1200m
    memswap_limit: 1200m
    volumes:
      - {type: bind, source: "${WX_DATA:-/srv/workouts}", target: "${WX_DATA:-/srv/workouts}", bind: {create_host_path: false}}
      - {type: bind, source: "${WX_OPERATOR:-/srv/workout-explorer/operator}", target: "${WX_OPERATOR:-/srv/workout-explorer/operator}", read_only: true, bind: {create_host_path: false}} # the operator file of the About page (F-29 AB-8), public content
    networks:
      backend: {ipv4_address: 10.250.1.3}

  caddy:
    <<: *common
    # The official image on our minor; patches float (F-59 IP-6). The one home of the minor:
    # the Podman unit and the bare-metal apt pin must carry the same (`make ci` checks).
    image: docker.io/library/caddy:2.11
    user: "10002:10002"
    group_add: ["10001"] # app's group: reads public/ and site/ (0750) and nothing else (DP-5)
    # No capability, not even in the bounding set: since 2.11.8 the binary's file capability has no
    # effective bit, so it runs without one (a cap_add here would leave it in CapPrm). Port 8088 needs none.
    command: ["caddy", "run", "--config", "/srv/workout-explorer/conf/Caddyfile", "--adapter", "caddyfile"]
    environment:
      WX_DATA: ${WX_DATA:-/srv/workouts}
      WX_API: app:8080
      WX_SITE: http://:8088 # any host: the site name lives only in WORKOUT_EXPLORER_BASE_URL (DP-6)
      WX_TRUSTED_PROXIES: ${WX_TRUSTED_PROXIES:-10.250.0.1} # default: the edge gateway (DP-1b)
      WX_ADMIN: localhost:2019 # for `caddy reload` inside this container only (DP-9)
    tmpfs: # the image's state directories (XDG_CONFIG_HOME, XDG_DATA_HOME); nothing here needs to survive
      - /config:uid=10002,gid=10002,mode=0700,size=16m
      - /data:uid=10002,gid=10002,mode=0700,size=16m
    volumes:
      - {type: bind, source: ./conf, target: /srv/workout-explorer/conf, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${WX_DATA:-/srv/workouts}/public", target: "${WX_DATA:-/srv/workouts}/public", read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${WX_DATA:-/srv/workouts}/site", target: "${WX_DATA:-/srv/workouts}/site", read_only: true, bind: {create_host_path: false}} # page shells and assets serve writes at start (ADR-043, ADR-053)
    ports:
      - "${WX_LISTEN:-127.0.0.1:8088}:8088" # the only published port; never a public address (DP-13)
    networks:
      edge: {} # gateway 10.250.0.1
      backend: {ipv4_address: 10.250.1.2}

networks:
  edge: # IPv4 only, fixed subnet so its gateway is known (DP-1)
    driver: bridge
    ipam: {config: [{subnet: 10.250.0.0/29, gateway: 10.250.0.1}]}
  backend: # no route out; app has no outbound connection unless compose.notify.yaml adds one (ADR-039)
    driver: bridge
    internal: true
    ipam: {config: [{subnet: 10.250.1.0/29}]}
