# Workout Explorer on one VPS (F-31, ADR-034 rev. 2): Caddy on plain HTTP behind the
# operator's reverse proxy, and the Go server on an internal network. Lives at
# /srv/workout-explorer/compose.yaml next to .env (deploy/example.env), bin/, web/, conf/.
# No image is built: both services run one pinned distroless base image with the
# binaries bind-mounted read-only (DP-2). Nothing here creates a host path (DP-3).
name: workout-explorer

x-common: &common
  # gcr.io/distroless/static-debian13:nonroot, the multi-arch index digest. A bump is a reviewed change.
  image: gcr.io/distroless/static-debian13:nonroot@sha256:25ac8f0c3b2334a9eb05452266bd4697864a8c8ef0ef71e5e6480d7f92868329
  restart: unless-stopped # a crash, an OOM kill or a reboot restarts; `docker compose stop` stays stopped (DP-7)
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  stop_grace_period: 30s # above serve's 10 s shutdown grace (F-01)
  logging:
    driver: local # size-rotated, on the VPS only (DP-11)
    options: {max-size: 10m, max-file: "5"}

services:
  app:
    <<: *common
    user: "10001:10001"
    entrypoint: ["/srv/workout-explorer/bin/workout-explorer"]
    command: ["serve", "-addr", ":8080", "-data", "${WX_DATA:-/srv/workouts}", "-web", "${WX_WEB:-/srv/workout-explorer/web}"]
    env_file: .env
    environment:
      # Caddy's address on `backend`: the one proxy Go believes (DP-1a). Same value as Caddy's ipv4_address below.
      WORKOUT_EXPLORER_TRUSTED_PROXY: 10.250.1.2
    # DP-8: memory.peak of 4 uploads at the parse limits (F-09 QA: 620 to 861 MB) + one publish
    # + the rate table at its maximum (112 MB) + 20 %, rounded up to 100 MB. The runbook records the
    # peak measured on the VPS; change this value only together with that record.
    mem_limit: 1200m
    memswap_limit: 1200m
    volumes:
      - {type: bind, source: ./bin, target: /srv/workout-explorer/bin, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${WX_WEB:-/srv/workout-explorer/web}", target: "${WX_WEB:-/srv/workout-explorer/web}", read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${WX_DATA:-/srv/workouts}", target: "${WX_DATA:-/srv/workouts}", bind: {create_host_path: false}}
    networks:
      backend: {ipv4_address: 10.250.1.3}

  caddy:
    <<: *common
    user: "10002:10002"
    group_add: ["10001"] # app's group: reads public/ (0750) and nothing else (DP-5)
    entrypoint: ["/srv/workout-explorer/bin/caddy", "run", "--config", "/srv/workout-explorer/conf/Caddyfile", "--adapter", "caddyfile"]
    environment:
      WX_DATA: ${WX_DATA:-/srv/workouts}
      WX_WEB: ${WX_WEB:-/srv/workout-explorer/web}
      WX_API: app:8080
      WX_SITE: http://:8088 # any host: the site name lives only in WORKOUT_EXPLORER_BASE_URL (DP-6)
      WX_TRUSTED_PROXIES: ${WX_TRUSTED_PROXIES:-10.250.0.1} # default: the edge gateway (DP-1b)
      WX_ADMIN: localhost:2019 # for `caddy reload` inside this container only (DP-9)
      XDG_CONFIG_HOME: /caddy-state/config
      XDG_DATA_HOME: /caddy-state/data
      HOME: /caddy-state
    tmpfs:
      - /caddy-state:uid=10002,gid=10002,mode=0700,size=16m # nothing here needs to survive
    volumes:
      - {type: bind, source: ./bin, target: /srv/workout-explorer/bin, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./conf, target: /srv/workout-explorer/conf, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${WX_WEB:-/srv/workout-explorer/web}", target: "${WX_WEB:-/srv/workout-explorer/web}", read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${WX_DATA:-/srv/workouts}/public", target: "${WX_DATA:-/srv/workouts}/public", read_only: true, bind: {create_host_path: false}}
    ports:
      - "${WX_LISTEN:-127.0.0.1:8088}:8088" # the only published port; never a public address (DP-13)
    networks:
      edge: {} # gateway 10.250.0.1
      backend: {ipv4_address: 10.250.1.2}

networks:
  edge: # IPv4 only, fixed subnet so its gateway is known (DP-1)
    driver: bridge
    ipam: {config: [{subnet: 10.250.0.0/29, gateway: 10.250.0.1}]}
  backend: # no route out; app has no outbound connection
    driver: bridge
    internal: true
    ipam: {config: [{subnet: 10.250.1.0/29}]}
