# Report notifications (F-27 R-11, ADR-039 item 5, ADR-034 rev. 4): gives `app` alone a
# route out, for the chosen notification service (Pushover, ntfy or a callback; any address,
# the LAN too). Select it together with the WORKOUT_EXPLORER_PUSHOVER_* or _NOTIFY_* settings in
# .env, by adding it to COMPOSE_FILE. Inside the container 127.0.0.1 is the app itself: reach a
# service on this host through its LAN or bridge address:
#   release:      COMPOSE_FILE=compose.yaml:compose.notify.yaml
#   self-builder: COMPOSE_FILE=compose.yaml:compose.build.yaml:compose.notify.yaml
# Without this file `app` has no outbound connection. Inbound is unchanged: no port is published.
services:
  app:
    networks:
      egress: {}

networks:
  egress: # not internal; IPv4, fixed subnet; app is its only member
    driver: bridge
    ipam: {config: [{subnet: 10.250.2.0/29}]}
