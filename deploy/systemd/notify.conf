# Report notifications on bare metal (ADR-039, F-59 IP-15): the form of compose.notify.yaml.
# Install as /etc/systemd/system/workout-explorer.service.d/notify.conf, with the
# WORKOUT_EXPLORER_PUSHOVER_* or _NOTIFY_* settings in .env. Lifts the app's outbound deny (any route, as
# with Compose); Caddy's unit stays local only. A ntfy or callback service on this host
# (127.0.0.1) needs no drop-in. For one on the LAN, write your own notify-lan.conf with
# IPAddressDeny= and IPAddressAllow=<address> instead of this file (deploy.sh compares only notify.conf).
[Service]
IPAddressDeny=
