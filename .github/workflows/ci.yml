name: ci
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/server/go.mod
          cache: true
          cache-dependency-path: src/server/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: src/web/.nvmrc
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      # F-31 DP-18, F-59 IP-3: a vX.Y.Z tag run builds with VERSION = the tag (binary and image label)
      # and hands the release assets and the tested image archive to the release job.
      - id: tag
        run: |
          if printf '%s' "$GITHUB_REF" | grep -Eq '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - run: make -k ci
      - if: steps.tag.outputs.release == 'true'
        run: |
          # The digest of the archive make ci tested (one plain manifest, checked there); the one
          # home of our image's reference is the release's compose.yaml (ADR-052 item 3).
          digest=$(tar -xOf build/image.oci.tar index.json | grep -o 'sha256:[0-9a-f]\{64\}' | head -1)
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          make deploy-archive APP_IMAGE="ghcr.io/$owner/workout-explorer:$GITHUB_REF_NAME@$digest"
          git rev-parse HEAD > build/COMMIT
          mkdir release image
          tar -C build -czf "release/workout-explorer-$GITHUB_REF_NAME-linux-amd64.tar.gz" workout-explorer web COMMIT
          cp build/deploy.tar.gz "release/workout-explorer-$GITHUB_REF_NAME-deploy.tar.gz"
          (cd release && sha256sum *.tar.gz > SHA256SUMS)
          mv build/image.oci.tar image/
          echo "$digest" > image/DIGEST
      - if: steps.tag.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/*
          retention-days: 1
      - if: steps.tag.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: image
          path: image/*
          retention-days: 1
    outputs:
      release: ${{ steps.tag.outputs.release }}
  release:
    needs: ci
    if: needs.ci.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the release (DP-14)
      packages: write # the app image (F-59 IP-4); the only write permissions in CI; no checkout, no repository code
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0 (pinned by SHA: this job holds the write token)
        with:
          name: release
          path: release
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: image
          path: image
      # IP-4 with the runner's skopeo: the tested archive pushed unchanged (digest preserved); a
      # version tag is never overwritten; latest moves only to a higher version.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag=$GITHUB_REF_NAME
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          repo=ghcr.io/$owner/workout-explorer
          digest=$(cat image/DIGEST)
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # manifest <ref> prints the raw manifest, nothing when the tag does not exist; any other error stops.
          manifest() {
            if skopeo inspect --raw "docker://$1" 2>err; then return; fi
            grep -qiE 'manifest unknown|name unknown|not found' err || { cat err >&2; exit 1; }
          }
          # (1) The version tag exists with another digest: stop, nothing changes. Same digest: a re-run completes.
          have=$(manifest "$repo:$tag")
          if [ -n "$have" ] && [ "sha256:$(printf '%s' "$have" | sha256sum | cut -d' ' -f1)" != "$digest" ]; then
            echo "$repo:$tag exists with another digest than $digest; a version tag is never overwritten"; exit 1
          fi
          # (2) Push exactly the tested bytes.
          skopeo copy --preserve-digests --digestfile pushed "oci-archive:image/image.oci.tar" "docker://$repo:$tag"
          [ "$(cat pushed)" = "$digest" ] || { echo "the registry reports $(cat pushed), not $digest"; exit 1; }
          # (3) The release; its deploy archive names $repo:$tag@$digest.
          tar -xOzf "release/workout-explorer-$tag-deploy.tar.gz" ./compose.yaml | grep -qx "    image: $repo:$tag@$digest" || { echo "the deploy archive does not name the pushed image"; exit 1; }
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$tag" --notes "" release/*
          # (4) latest only to a higher version than the current latest's label (numeric per component).
          cur=
          latest=$(manifest "$repo:latest") # an assignment, so a registry error stops the job (set -e)
          if [ -n "$latest" ]; then
            cur=$(skopeo inspect --format '{{index .Labels "org.opencontainers.image.version"}}' "docker://$repo:latest")
          fi
          newer() { [ -z "$2" ] || [ "$(printf '%s\n%s\n' "${1#v}" "${2#v}" | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)" = "${1#v}" ] && [ "${1#v}" != "${2#v}" ]; }
          if newer "$tag" "$cur"; then
            skopeo copy --preserve-digests "docker://$repo@$digest" "docker://$repo:latest"
          else
            echo "latest stays at ${cur:-?}"
          fi
