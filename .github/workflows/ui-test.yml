name: ui-test
# Nightly browser suite (src/web/e2e, README there); not on push or PR. Synthetic fixtures only; the repo is public.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  # Scheduled runs only when main has new code since the last successful run; dispatch always runs.
  changed:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --repo ${{ github.repository }} --workflow ui-test.yml --branch main --status success --limit 1 --json headSha -q '.[0].headSha')
          if [ "${{ github.event_name }}" = schedule ] && [ "$last" = "${{ github.sha }}" ]; then r=false; else r=true; fi
          echo "run=$r" >> "$GITHUB_OUTPUT"
  ui-test:
    needs: changed
    if: github.event_name != 'schedule' || needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit, firefox, iPhone, Android, iPad, firefox-phone]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/server/go.mod
          cache: true
          cache-dependency-path: src/server/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: src/web/.nvmrc
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      # WebKit core dumps are ~6 GB; run.sh also passes --ulimit core=0 to the container.
      - run: ulimit -c 0 && make ui-test PROJECT=${{ matrix.project }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-${{ matrix.project }}
          path: |
            build/ui-test/html
            build/ui-test/results
          retention-days: 14
