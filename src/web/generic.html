<!doctype html>
<!-- Generic page (F-15 P-12): what Caddy serves, with status 404, for every /w/{public_id} without a page (draft, private, deleted, expired, unknown). One static file, so the answer is the same for every ID. No script but the head script and the static entry (F-54 LG-5), no Open Graph data, no workout data, no link to a workout. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Workout Explorer</title>
    <script>var d=document.documentElement,D=d.dataset,L=["en","de","es","fr"],l,u,v;try{var s=localStorage,t=s.getItem("wx.theme");if(t=="light"||t=="dark")D.theme=t;if(s.getItem("wx.hint.done")=="1")D.hint="done";if(s.getItem("wx.charts")=="tall")D.chartSize="tall";l=s.getItem("wx.lang");if(/^\d{1,3}(\.\d{1,2})?$/.test(v=s.getItem(matchMedia("(max-width: 1023.98px) and (orientation: landscape) and (max-height: 500px)").matches?"wx.split.landscape":"wx.split.wide"))&&v>=30&&!(v>70))d.style.setProperty("--map-w",v+"%")}catch(e){}if(L.indexOf(l)==-1){l="en";(navigator.languages||[navigator.language]).some(function(x){x=String(x).split("-")[0].toLowerCase();return L.indexOf(x)>=0&&(l=x)})}D.lang=l;u=document.querySelector("meta[data-hold]");u=u&&u.getAttribute("data-"+l);if(u){D.hold="";window.wxLang=fetch(u);setTimeout(function(){delete D.hold},500)}</script>
    <script type="module" src="/src/static/main.ts"></script>
    <link rel="stylesheet" href="/src/generic/generic.css" />
  </head>
  <body>
    <main>
      <h1>Workout Explorer</h1>
      <p data-t="genericGone">This workout has expired or is not available.</p>
    </main>
    <footer><a href="/about" data-t="genericAbout">About</a> <!--wx:impressum--></footer>
  </body>
</html>
