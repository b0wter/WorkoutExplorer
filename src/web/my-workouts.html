<!doctype html>
<!-- F-53 MW-1: the My workouts page, served by Caddy for /my-workouts with no-store (it renders edit links). main.ts switches on #wx-mine and loads src/mine/. No Open Graph card. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>My workouts · Workout Explorer</title>
    <script>var d=document.documentElement,D=d.dataset,L=["en","de","es","fr"],l,u;try{var s=localStorage,t=s.getItem("wx.theme");if(t=="light"||t=="dark")D.theme=t;if(s.getItem("wx.hint.done")=="1")D.hint="done";l=s.getItem("wx.lang")}catch(e){}if(L.indexOf(l)==-1){l="en";(navigator.languages||[navigator.language]).some(function(x){x=String(x).split("-")[0].toLowerCase();return L.indexOf(x)>=0&&(l=x)})}D.lang=l;u=document.querySelector("meta[data-hold]");u=u&&u.getAttribute("data-"+l);if(u){D.hold="";window.wxLang=fetch(u);setTimeout(function(){delete D.hold},500)}</script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <template id="wx-impressum"><!--wx:impressum--></template>
    <div id="wx-mine"><noscript><p>My workouts needs JavaScript. Turn it on in your browser to see the workouts uploaded from this browser.</p></noscript></div>
  </body>
</html>
