<!doctype html>
<!-- The edit page (F-19 design E-1): one static file, served by Caddy for every /edit/* with no-store. No workout data and no data file preload: the owner chunk loads settings and draft.bin with the token from the fragment (lib/owner). The #wx-edit element is the marker main.ts switches on. Caddy serves it for /published/* too, so its card is SH-11's fixed warning (F-23 PC-9). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:title" content="Edit link: do not share" />
    <meta property="og:description" content="Anyone with this link can change or delete this workout." />
    <meta name="twitter:card" content="summary" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Workout Explorer</title>
    <script>try{var t=localStorage.getItem("wx.theme");if(t=="light"||t=="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <svg class="sprite" aria-hidden="true"><defs>
      <symbol id="sport-cycling" viewBox="0 0 24 24"><circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-8h5l3 8M10 8H8"/></symbol>
      <symbol id="sport-running" viewBox="0 0 24 24"><circle cx="14" cy="5" r="2"/><path d="M12 9l-3 4 3 2v5M12 9l4 2 2 3M9 13l-3 1"/></symbol>
      <symbol id="sport-walking" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M12 8v6l-3 6M12 14l3 6M9 10l3-2 3 2"/></symbol>
      <symbol id="sport-hiking" viewBox="0 0 24 24"><circle cx="11" cy="5" r="2"/><path d="M11 8v6l-3 6M11 14l3 6M8 10l3-2 3 2M18 8v13"/></symbol>
      <symbol id="sport-swimming" viewBox="0 0 24 24"><circle cx="16" cy="6" r="2"/><path d="M4 12l6-3 4 3M3 17q2 2 4.5 0t4.5 0 4.5 0 4.5 0"/></symbol>
      <symbol id="sport-rowing" viewBox="0 0 24 24"><path d="M3 16h18l-3 4H6zM6 13l12-6M16 5l3 3"/></symbol>
      <symbol id="sport-generic" viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></symbol>
    </defs></svg>
    <div id="wx-edit"></div>
  </body>
</html>
